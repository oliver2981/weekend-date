<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>给 Dammy 的小惊喜 💌</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #ffe3ec 0%, #ffc2d4 45%, #ffb3c6 100%);
    color: #8b3a52;
  }

  #hearts-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .heart-drop {
    position: absolute;
    top: -5vh;
    animation: fall linear forwards;
    opacity: .8;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); opacity: .3; }
  }

  .screen {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 24px;
    text-align: center;
  }
  .screen.active { display: flex; animation: screenIn .55s ease both; }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .dots {
    position: fixed;
    top: 22px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: 10px;
    z-index: 3;
  }
  .dots span {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: rgba(255,255,255,.6);
    transition: all .3s;
  }
  .dots span.on { background: #ff5c8a; transform: scale(1.3); }

  .emoji-big { font-size: 64px; margin-bottom: 18px; animation: bounce 1.6s ease-in-out infinite; }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-10px); }
  }

  h1 { font-size: 26px; line-height: 1.5; margin-bottom: 10px; }
  .sub { font-size: 15px; color: #b06078; margin-bottom: 30px; line-height: 1.6; }

  .btn {
    border: none;
    border-radius: 999px;
    padding: 15px 42px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(135deg, #ff7ba9, #ff4f7e);
    box-shadow: 0 8px 20px rgba(255, 79, 126, .4);
    transition: transform .15s;
  }
  .btn:active { transform: scale(.94); }
  .btn.secondary {
    background: #fff;
    color: #c76b86;
    box-shadow: 0 6px 16px rgba(0,0,0,.08);
  }
  .btn:disabled { opacity: .45; box-shadow: none; }

  #btn-no {
    position: relative;
    padding: 13px 34px;
    font-size: 16px;
  }
  #btn-no.fleeing { position: fixed; z-index: 5; transition: left .18s, top .18s; }

  .btn-row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center; }

  .options { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 340px; }
  .opt {
    background: rgba(255,255,255,.85);
    border: 2.5px solid transparent;
    border-radius: 18px;
    padding: 16px 18px;
    font-size: 17px;
    font-weight: 600;
    color: #a04d68;
    cursor: pointer;
    transition: all .2s;
    box-shadow: 0 4px 12px rgba(200, 90, 120, .12);
  }
  .opt.sel {
    border-color: #ff5c8a;
    background: #fff;
    transform: scale(1.03);
    box-shadow: 0 6px 18px rgba(255, 92, 138, .3);
  }
  .opt small { display: block; font-weight: normal; font-size: 13px; color: #c58a9c; margin-top: 3px; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    max-width: 360px;
    max-height: 46vh;
    overflow-y: auto;
    padding: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .card {
    background: rgba(255,255,255,.85);
    border: 2.5px solid transparent;
    border-radius: 16px;
    padding: 14px 8px;
    cursor: pointer;
    transition: all .2s;
    box-shadow: 0 4px 10px rgba(200, 90, 120, .1);
  }
  .card .ico { font-size: 30px; display: block; margin-bottom: 6px; }
  .card .txt { font-size: 13.5px; font-weight: 600; color: #a04d68; line-height: 1.35; }
  .card.sel {
    border-color: #ff5c8a;
    background: #fff;
    transform: scale(1.05);
    box-shadow: 0 6px 16px rgba(255, 92, 138, .3);
  }

  .next-wrap { margin-top: 24px; }

  .invite {
    background: rgba(255,255,255,.94);
    border-radius: 24px;
    padding: 28px 24px;
    width: 100%;
    max-width: 350px;
    box-shadow: 0 14px 40px rgba(200, 60, 100, .25);
    position: relative;
  }
  .invite::before {
    content: "💌";
    position: absolute;
    top: -22px; left: 50%;
    transform: translateX(-50%);
    font-size: 40px;
  }
  .invite h2 { font-size: 21px; margin: 14px 0 6px; color: #e14b76; }
  .invite .line {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px dashed #f3c6d3;
    font-size: 15px;
  }
  .invite .line b { color: #d4577c; text-align: right; max-width: 62%; }
  .invite .note {
    margin-top: 16px;
    font-size: 14px;
    color: #b06078;
    line-height: 1.8;
    font-style: italic;
  }

  #countdown {
    margin-top: 20px;
    display: none;
    gap: 10px;
    justify-content: center;
  }
  #countdown .cd {
    background: rgba(255,255,255,.9);
    border-radius: 14px;
    padding: 10px 0;
    width: 66px;
    box-shadow: 0 4px 12px rgba(200,90,120,.15);
  }
  #countdown .cd b { display: block; font-size: 22px; color: #e14b76; }
  #countdown .cd i { font-style: normal; font-size: 12px; color: #c58a9c; }
  .cd-title { margin-top: 26px; font-size: 15px; color: #b06078; display: none; }

  #fireworks {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    display: none;
  }

  .final-msg {
    display: none;
    margin-top: 18px;
    font-size: 17px;
    color: #e14b76;
    font-weight: bold;
    animation: screenIn .6s ease both;
  }
</style>
</head>
<body>

<div id="hearts-bg"></div>
<canvas id="fireworks"></canvas>

<div class="dots" id="dots">
  <span class="on"></span><span></span><span></span><span></span>
</div>

<!-- 第 1 步：邀约 -->
<section class="screen active" id="s1">
  <div class="emoji-big">🥺👉👈</div>
  <h1 id="q1"></h1>
  <p class="sub">人家鼓起好大的勇气才问出口的…</p>
  <div class="btn-row">
    <button class="btn" id="btn-yes">愿意呀 💕</button>
    <button class="btn secondary" id="btn-no">让我想想</button>
  </div>
</section>

<!-- 第 2 步：选时间 -->
<section class="screen" id="s2">
  <div class="emoji-big">📅</div>
  <h1>耶！那我们什么时候见面？</h1>
  <p class="sub">选一个你最方便的时间～</p>
  <div class="options" id="day-opts"></div>
  <div class="options" id="slot-opts" style="margin-top:14px;"></div>
  <div class="next-wrap">
    <button class="btn" id="btn-time" disabled>就这个时间 ✨</button>
  </div>
</section>

<!-- 第 3 步：选项目 -->
<section class="screen" id="s3">
  <div class="emoji-big">🎡</div>
  <h1>想和我一起做什么呢？</h1>
  <p class="sub">可以多选哦，全选也没问题 😏</p>
  <div class="grid" id="act-grid"></div>
  <div class="next-wrap">
    <button class="btn" id="btn-act" disabled>选好啦 💫</button>
  </div>
</section>

<!-- 第 4 步：邀请函 -->
<section class="screen" id="s4">
  <div class="invite">
    <h2>约会邀请函</h2>
    <div class="line"><span>受邀人</span><b id="r-name"></b></div>
    <div class="line"><span>时间</span><b id="r-time"></b></div>
    <div class="line"><span>行程</span><b id="r-acts"></b></div>
    <p class="note" id="r-note"></p>
  </div>
  <p class="cd-title" id="cd-title">⏰ 距离我们的约会还有</p>
  <div id="countdown">
    <div class="cd"><b id="cd-d">0</b><i>天</i></div>
    <div class="cd"><b id="cd-h">0</b><i>时</i></div>
    <div class="cd"><b id="cd-m">0</b><i>分</i></div>
    <div class="cd"><b id="cd-s">0</b><i>秒</i></div>
  </div>
  <div class="next-wrap">
    <button class="btn" id="btn-final">就这么定啦 💕</button>
  </div>
  <p class="final-msg" id="final-msg">收到！我已经开始期待啦，到时候见 😘</p>
</section>

<script>
/* ==================== 配置区（想改就改这里） ==================== */
const CONFIG = {
  herName: "Dammy",
  // Server酱 SendKey：去 https://sct.ftqq.com 微信扫码登录后复制，填在引号里
  sendKey: "SCT379974TPRHFJfd9n5fpMuo9ULazKJy6",
  loveNote: "遇见你之后，每个周末都变得值得期待。这次也请多多指教啦 💗",
  activities: [
    { ico: "🎹", txt: "一起弹钢琴" },
    { ico: "🎬", txt: "看一场电影" },
    { ico: "🍰", txt: "一起做蛋糕" },
    { ico: "✂️", txt: "做手工" },
    { ico: "📸", txt: "当Oli摄影师的专属模特" },
    { ico: "🧗", txt: "攀岩 / 健身房" },
    { ico: "🐱", txt: "猫咖撸猫" },
    { ico: "🐶", txt: "狗咖吸狗" },
    { ico: "🍜", txt: "吃好吃的" },
    { ico: "🧺", txt: "公园野餐" },
    { ico: "🎨", txt: "看展 / 美术馆" },
    { ico: "🎲", txt: "桌游 / 密室逃脱" },
    { ico: "🌃", txt: "夜市散步" },
    { ico: "🎤", txt: "KTV 唱歌" }
  ],
  slots: [
    { key: "上午", hour: 10, hint: "阳光正好的早晨 ☀️" },
    { key: "下午", hour: 14, hint: "慵懒惬意的午后 🌤" },
    { key: "晚上", hour: 19, hint: "浪漫温柔的夜晚 🌙" }
  ]
};
/* ================================================================ */

const state = { day: null, slot: null, acts: [] };

document.getElementById("q1").textContent =
  CONFIG.herName + "，这周末愿意和我去约会吗？";

/* ---------- 飘落爱心背景 ---------- */
const HEARTS = ["💗","💕","🌸","💖","✨","🩷"];
function dropHeart() {
  const el = document.createElement("div");
  el.className = "heart-drop";
  el.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];
  el.style.left = Math.random() * 100 + "vw";
  el.style.fontSize = 14 + Math.random() * 20 + "px";
  el.style.animationDuration = 5 + Math.random() * 6 + "s";
  document.getElementById("hearts-bg").appendChild(el);
  setTimeout(() => el.remove(), 12000);
}
setInterval(dropHeart, 500);
for (let i = 0; i < 10; i++) setTimeout(dropHeart, i * 200);

/* ---------- 页面切换 ---------- */
function goto(n) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("s" + n).classList.add("active");
  document.querySelectorAll("#dots span").forEach((d, i) =>
    d.classList.toggle("on", i < n));
}

/* ---------- 第 1 步：逃跑按钮 ---------- */
const btnNo = document.getElementById("btn-no");
const NO_TEXTS = ["让我想想", "别跑呀", "点不到点不到", "嘿嘿 就不", "放弃吧~", "人家会伤心的 🥺"];
let noCount = 0;
function flee() {
  btnNo.classList.add("fleeing");
  const pad = 20;
  const w = btnNo.offsetWidth, h = btnNo.offsetHeight;
  btnNo.style.left = pad + Math.random() * (innerWidth - w - pad * 2) + "px";
  btnNo.style.top = pad + Math.random() * (innerHeight - h - pad * 2) + "px";
  noCount++;
  btnNo.textContent = NO_TEXTS[Math.min(noCount, NO_TEXTS.length - 1)];
}
btnNo.addEventListener("mouseover", flee);
btnNo.addEventListener("touchstart", e => { e.preventDefault(); flee(); }, { passive: false });
btnNo.addEventListener("click", flee);

document.getElementById("btn-yes").addEventListener("click", () => {
  btnNo.remove();
  goto(2);
});

/* ---------- 第 2 步：选时间 ---------- */
function weekendDates() {
  const now = new Date();
  const res = [];
  for (const dow of [6, 0]) {          // 周六、周日
    const d = new Date(now);
    let diff = (dow - now.getDay() + 7) % 7;
    if (dow === 0 && diff === 0) diff = 0;   // 今天就是周日也算
    d.setDate(now.getDate() + diff);
    res.push({
      label: dow === 6 ? "周六" : "周日",
      date: d,
      text: (d.getMonth() + 1) + "月" + d.getDate() + "日"
    });
  }
  return res;
}
const days = weekendDates();
const dayBox = document.getElementById("day-opts");
days.forEach((d, i) => {
  const el = document.createElement("div");
  el.className = "opt";
  el.innerHTML = d.label + " · " + d.text;
  el.onclick = () => {
    state.day = d;
    dayBox.querySelectorAll(".opt").forEach(o => o.classList.remove("sel"));
    el.classList.add("sel");
    checkTime();
  };
  dayBox.appendChild(el);
});
const slotBox = document.getElementById("slot-opts");
CONFIG.slots.forEach(s => {
  const el = document.createElement("div");
  el.className = "opt";
  el.innerHTML = s.key + "<small>" + s.hint + "</small>";
  el.onclick = () => {
    state.slot = s;
    slotBox.querySelectorAll(".opt").forEach(o => o.classList.remove("sel"));
    el.classList.add("sel");
    checkTime();
  };
  slotBox.appendChild(el);
});
function checkTime() {
  document.getElementById("btn-time").disabled = !(state.day && state.slot);
}
document.getElementById("btn-time").addEventListener("click", () => goto(3));

/* ---------- 第 3 步：选项目 ---------- */
const grid = document.getElementById("act-grid");
CONFIG.activities.forEach(a => {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = '<span class="ico">' + a.ico + '</span><span class="txt">' + a.txt + "</span>";
  el.onclick = () => {
    el.classList.toggle("sel");
    const name = a.ico + " " + a.txt;
    const i = state.acts.indexOf(name);
    i >= 0 ? state.acts.splice(i, 1) : state.acts.push(name);
    document.getElementById("btn-act").disabled = state.acts.length === 0;
  };
  grid.appendChild(el);
});
document.getElementById("btn-act").addEventListener("click", () => {
  document.getElementById("r-name").textContent = CONFIG.herName + " 小姐 💝";
  document.getElementById("r-time").textContent =
    state.day.label + " " + state.day.text + " " + state.slot.key;
  document.getElementById("r-acts").textContent = state.acts.join("、");
  document.getElementById("r-note").textContent = CONFIG.loveNote;
  goto(4);
});

/* ---------- 第 4 步：确认 + 烟花 + 倒计时 + 推送 ---------- */
document.getElementById("btn-final").addEventListener("click", function () {
  this.style.display = "none";
  document.getElementById("final-msg").style.display = "block";
  startFireworks();
  startCountdown();
  sendNotify();
});

function sendNotify() {
  if (!CONFIG.sendKey) return;
  const title = CONFIG.herName + " 答应和你约会啦！🎉";
  const desp = "时间：" + state.day.label + " " + state.day.text + " " + state.slot.key +
    "\n\n项目：" + state.acts.join("、");
  const url = "https://sctapi.ftqq.com/" + CONFIG.sendKey + ".send?title=" +
    encodeURIComponent(title) + "&desp=" + encodeURIComponent(desp);
  fetch(url, { mode: "no-cors" }).catch(() => { new Image().src = url; });
}

function startCountdown() {
  const t = new Date(state.day.date);
  t.setHours(state.slot.hour, 0, 0, 0);
  document.getElementById("cd-title").style.display = "block";
  document.getElementById("countdown").style.display = "flex";
  function tick() {
    let ms = t - Date.now();
    if (ms < 0) ms = 0;
    const s = Math.floor(ms / 1000);
    document.getElementById("cd-d").textContent = Math.floor(s / 86400);
    document.getElementById("cd-h").textContent = Math.floor(s % 86400 / 3600);
    document.getElementById("cd-m").textContent = Math.floor(s % 3600 / 60);
    document.getElementById("cd-s").textContent = s % 60;
  }
  tick();
  setInterval(tick, 1000);
}

/* ---------- 烟花 & 爱心爆炸 ---------- */
function startFireworks() {
  const cv = document.getElementById("fireworks");
  cv.style.display = "block";
  cv.width = innerWidth; cv.height = innerHeight;
  const ctx = cv.getContext("2d");
  const parts = [];
  const COLORS = ["#ff5c8a", "#ffd166", "#ff8fab", "#c77dff", "#7bdff2", "#fff"];

  function boom(x, y) {
    const n = 36 + Math.random() * 24;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = 2 + Math.random() * 5;
      parts.push({
        x, y,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        life: 1,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        heart: Math.random() < 0.3,
        size: 3 + Math.random() * 3
      });
    }
  }

  let booms = 0;
  const boomTimer = setInterval(() => {
    boom(innerWidth * (0.15 + Math.random() * 0.7), innerHeight * (0.12 + Math.random() * 0.5));
    if (++booms > 14) clearInterval(boomTimer);
  }, 420);
  boom(innerWidth / 2, innerHeight / 3);

  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.05;
      p.life -= 0.012;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      ctx.globalAlpha = p.life;
      if (p.heart) {
        ctx.font = p.size * 4 + "px serif";
        ctx.fillText("💗", p.x, p.y);
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    if (parts.length || booms <= 14) requestAnimationFrame(draw);
    else cv.style.display = "none";
  }
  draw();
}
</script>
</body>
</html>
